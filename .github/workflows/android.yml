name: Android CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Verify
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4

      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEX_REMOTE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::CODEX_REMOTE_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/codex-remote-release.p12"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "CODEX_REMOTE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          CODEX_REMOTE_KEYSTORE_PASSWORD: ${{ secrets.CODEX_REMOTE_KEYSTORE_PASSWORD }}
          CODEX_REMOTE_KEY_ALIAS: ${{ secrets.CODEX_REMOTE_KEY_ALIAS }}
          CODEX_REMOTE_KEY_PASSWORD: ${{ secrets.CODEX_REMOTE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintVitalRelease assembleRelease bundleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/codex-android-${VERSION_NAME}-release.apk"
          AAB="dist/codex-android-${VERSION_NAME}-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB"
          (
            cd dist
            sha256sum "$(basename "$APK")" "$(basename "$AAB")" > SHA256SUMS.txt
          )

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK")"
          jq -n \
            --argjson formatVersion 1 \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$APK")" \
            --arg sha256 "$APK_SHA256" \
            --argjson sizeBytes "$APK_SIZE" \
            --arg changelog "包含最新修复与使用体验改进。" \
            '{
              formatVersion: $formatVersion,
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              sizeBytes: $sizeBytes,
              changelog: $changelog
            }' > dist/latest.json

          {
            echo "# Codex ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo "由 GitHub Actions 自动构建并发布。"
            echo
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 应用包名：\`com.codex.remote\`"
            echo "- 应用内更新清单：\`latest.json\`"
            echo "- APK：已通过 APK Signature Scheme 校验"
            echo "- AAB：已通过 JAR 签名校验"
            echo
            echo "## 校验值"
            echo
            echo '```text'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > dist/RELEASE_NOTES.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/codex-android-${VERSION_NAME}-release.apk" \
              "dist/codex-android-${VERSION_NAME}-release.aab" \
              "dist/latest.json" \
              "dist/SHA256SUMS.txt" \
              --clobber
            gh release edit "$TAG" \
              --title "Codex ${VERSION_NAME}" \
              --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              "dist/codex-android-${VERSION_NAME}-release.apk" \
              "dist/codex-android-${VERSION_NAME}-release.aab" \
              "dist/latest.json" \
              "dist/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "Codex ${VERSION_NAME}" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Point release tag to current commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="$GITHUB_SHA" \
            -F force=true >/dev/null

      - name: Remove signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/codex-remote-release.p12"
